  <style>
    :root {
      --ink: #0b0a08;
      --paper: #efe6d4;
      --paper-dim: #c8beab;
      --muted: #8d8474;
      --copper: #c9a36a;
      --ember: #d4784a;
      --line: rgba(237, 230, 214, 0.14);
      --display: "Instrument Serif", "Noto Serif SC", serif;
      --sans: "Syne", "Noto Sans SC", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    html, body { margin: 0; min-height: 100%; background: #121212; color: #f4f4f4; }
    button, a, input, select, textarea { touch-action: manipulation; }
    html.mode-paper, body.mode-paper { background: #efe6d4; color: #16120c; }
    body {
      font-family: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      transition: background .4s ease, color .4s ease;
    }
    body.mode-paper { font-family: var(--sans); }
    body.mode-paper { background: #efe6d4; color: #16120c; }
    body.has-pointer { cursor: none; }
    body.has-pointer a, body.has-pointer button { cursor: none; }
    ::selection { background: var(--copper); color: var(--ink); }
    .serif { font-family: var(--display); }
    .mono { font-family: var(--mono); }
    .pretty { text-wrap: pretty; }

    .grain, .vignette, .spot, .cursor-dot, .cursor-ring { pointer-events: none; }
    .grain {
      position: fixed; inset: 0; z-index: 3; opacity: .14; mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    body:not(.mode-paper) .grain, body:not(.mode-paper) .spot { opacity: 0; }
    .vignette {
      position: fixed; inset: 0; z-index: 2;
      background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.5) 100%);
    }
    body:not(.mode-paper) .vignette { opacity: .2; }
    body.mode-paper .vignette, html.mode-paper .vignette { opacity: 0; }
    .spot {
      position: fixed; inset: 0; z-index: 1;
      background: radial-gradient(520px circle at var(--mx, 50%) var(--my, 28%), rgba(201,163,106,.16), transparent 46%);
    }
    .cursor-dot, .cursor-ring {
      position: fixed; top: 0; left: 0; z-index: 200; border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .cursor-dot { width: 6px; height: 6px; background: var(--copper); }
    .cursor-ring {
      width: 36px; height: 36px; border: 1px solid rgba(201,163,106,.7);
      transition: width .25s ease, height .25s ease, background .25s ease;
    }
    .cursor-ring.hot { width: 64px; height: 64px; background: rgba(201,163,106,.1); }

    .site-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 90;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
      padding: calc(10px + env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) 10px max(20px, env(safe-area-inset-left, 0px));
      background: rgba(18,18,18,.72);
      backdrop-filter: blur(16px);
      pointer-events: none;
    }
    .site-nav button, .nav-right, .nav-links { pointer-events: auto; }
    .nav-brand, .nav-right { flex-shrink: 0; }
    .nav-links { display: flex; gap: 22px; flex: 1; justify-content: center; }
    .nav-right button {
      background: none; border: 0; color: #c8c8c8; font: inherit; font-size: 13px;
      min-height: 40px; min-width: 36px; padding: 0 6px;
    }
    .nav-links button, .nav-brand {
      background: none; border: 0; color: #c8c8c8;
      font-family: var(--sans); font-size: 14px; letter-spacing: 0; text-transform: none;
    }
    .nav-links button.is-on, .nav-brand { color: #fff; }
    .nav-brand {
      display: inline-flex; align-items: center; gap: 2px;
      font-weight: 800; letter-spacing: -.02em; font-size: 18px;
    }
    .logo-m {
      width: 28px; height: 28px; display: block; flex: 0 0 auto;
      filter: drop-shadow(0 0 8px rgba(160,140,255,.45));
    }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .search-btn {
      width: 36px; height: 36px; border: 0; background: transparent; color: #c8c8c8;
      display: grid; place-items: center; border-radius: 50%;
    }
    .search-btn:hover { color: #fff; }
    body.mode-paper .site-nav { background: rgba(239,230,212,.86); }
    body.mode-paper .nav-links button, body.mode-paper .nav-brand { color: #6b6458; }
    body.mode-paper .nav-links button.is-on, body.mode-paper .nav-brand { color: #16120c; }
    body.mode-paper .search-btn { color: #6b6458; }

    .hero {
      position: relative;
      min-height: calc(100svh - (min(100vw, 1440px) - 98px) * 0.1875 - 108px);
      padding: calc(96px + env(safe-area-inset-top, 0px)) 24px 40px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
    }
    .hero-title {
      font-family: var(--sans); font-weight: 900; line-height: 1.12;
      font-size: clamp(32px, 5.8vw, 64px); letter-spacing: -.04em; max-width: 16ch;
    }
    .hero-title em {
      font-style: normal;
      background: linear-gradient(90deg, #ffd4b8 0%, #f3c4e4 52%, #d8c8ff 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .hero-sub { max-width: 680px; margin: 28px auto 0; color: #a3a3a3; font-size: 17px; line-height: 1.9; }
    .hero-mc { display: flex; flex-wrap: wrap; justify-content: center; gap: .2em 1.1em; }
    .hero-role { display: block; margin-top: 10px; }
    .hero-sub .mc { font-weight: 800; font-size: 1.22em; }
    .hero-sub .mc-m { color: #ffb38a; }
    .hero-sub .mc-c { color: #f3a0d4; }
    .hero-sub .mc-y { color: #c8b4ff; }
    .hero-sub .mc-o { color: #8ee8d8; }
    .hero-cta, .pill-btn {
      display: inline-flex; align-items: center; justify-content: center; margin-top: 28px;
      background: #fff; color: #111; border: 0; border-radius: 999px; padding: 12px 24px;
      font-weight: 600; font-size: 15px; text-decoration: none;
    }
    .pill-btn { margin-top: 0; cursor: pointer; }
    .hero-meta, .vol, .hero-kicker { display: none; }
    .scroll-cue { animation: cue 1.8s ease-in-out infinite; }
    @keyframes cue { 50% { transform: translateY(6px); opacity: .4; } }

    .section { position: relative; z-index: 2; padding: 110px 28px; max-width: 1440px; margin: 0 auto; }
    .section-head {
      display: flex; justify-content: space-between; align-items: end; gap: 24px;
      margin-bottom: 40px; border-bottom: 1px solid var(--line); padding-bottom: 18px;
    }
    body.mode-paper .section-head { border-color: rgba(22,18,12,.14); }
    .section-idx { font-family: var(--mono); font-size: 11px; letter-spacing: .24em; color: var(--copper); }
    .section-title { font-family: var(--display); font-size: clamp(40px, 6vw, 84px); line-height: .95; }

    .mc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); }
    .mc-card { background: var(--ink); padding: 36px 28px 40px; min-height: 260px; }
    .mc-card b { display: block; font-family: var(--display); font-size: 72px; line-height: 1; color: var(--copper); }
    .mc-card h3 { margin: 18px 0 10px; font-size: 18px; }
    .mc-card p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; }

    #work { scroll-margin-top: 72px; }
    .work-section { padding: 4px 28px 90px; max-width: 1440px; margin: 0 auto; }
    .filters { display: flex; justify-content: center; margin: 0 0 16px; }
    .filter-track {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 4px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(0,0,0,.28);
    }
    .filters button, .filter-track button {
      border: 0; background: transparent; color: #9a9a9a;
      padding: 6px 18px; border-radius: 999px;
      font-family: var(--sans); font-size: 14px;
    }
    .filters button.on, .filter-track button.on { color: #fff; background: #202020; }
    body.mode-paper .filter-track { border-color: rgba(22,18,12,.12); background: rgba(255,255,255,.35); }
    body.mode-paper .filters button { color: #5c5346; }
    body.mode-paper .filters button.on { background: #16120c; color: #efe6d4; }

    .work-grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px 14px; align-items: start;
    }
    .work-card { display: flex; flex-direction: column; text-decoration: none; color: #fff; }
    .work-media {
      position: relative; aspect-ratio: 4 / 3; border-radius: 20px; overflow: hidden;
      background: #1a1a1a;
    }
    .cover-img {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
      transition: transform .7s cubic-bezier(.16,1,.3,1);
    }
    .work-cap span { min-width: 0; }
    .work-cap {
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
      padding: 12px 4px 0; font-size: 15px; font-weight: 600;
    }
    .work-cap small { color: #8a8a8a; font-weight: 400; font-size: 13px; }
    .scene i, .scene b, .scene em { position: absolute; pointer-events: none; font-style: normal; }
    @keyframes floatY { 50% { transform: translateY(-8px); } }
    @keyframes drift { 50% { transform: translateX(12px); } }
    @keyframes pulse { 50% { opacity: .35; transform: scale(1.08); } }
    @keyframes growX { from { transform: scaleX(.2); } to { transform: scaleX(1); } }
    @keyframes spinSlow { to { transform: rotate(360deg); } }
    @keyframes dash { to { stroke-dashoffset: -120; } }
    @keyframes rain { to { transform: translateY(140%); } }

    .scene-ba { background: radial-gradient(circle at 18% 20%, #3a2c1c, #0c0b09 68%); }
    .scene-ba i { width: 11px; height: 11px; border-radius: 50%; background: #e8c48a; box-shadow: 0 0 16px #e8c48a; animation: floatY 4s ease-in-out infinite; }
    .scene-ba i:nth-child(1) { left: 14%; top: 28%; }
    .scene-ba i:nth-child(2) { left: 42%; top: 18%; animation-delay: .4s; }
    .scene-ba i:nth-child(3) { left: 68%; top: 34%; animation-delay: .8s; }
    .scene-ba i:nth-child(4) { left: 30%; top: 58%; animation-delay: .2s; }
    .scene-ba i:nth-child(5) { left: 78%; top: 62%; animation-delay: 1s; }
    .scene-ba b { left: 16%; top: 32%; width: 62%; height: 2px; background: linear-gradient(90deg, #e8c48a, transparent); transform: rotate(12deg); opacity: .55; }
    .scene-ba em { right: 10%; top: 14%; width: 38%; height: 54px; border: 1px solid rgba(232,196,138,.35); border-radius: 10px; background: rgba(20,16,12,.4); }

    .scene-ebi { background: #06140f; }
    .scene-ebi::after { content:""; position:absolute; inset:0; background: repeating-linear-gradient(180deg, transparent 0 10px, rgba(61,204,138,.04) 10px 11px); animation: drift 6s ease-in-out infinite; }
    .scene-ebi i { left: 12%; height: 9px; border-radius: 6px; background: #3dcc8a; transform-origin: left; animation: growX 2.4s ease-in-out infinite alternate; }
    .scene-ebi i:nth-child(1) { top: 28%; width: 58%; }
    .scene-ebi i:nth-child(2) { top: 44%; width: 42%; animation-delay: .3s; background: #7be0b0; }
    .scene-ebi i:nth-child(3) { top: 60%; width: 70%; animation-delay: .6s; }
    .scene-ebi b { right: 12%; top: 18%; width: 72px; height: 72px; border: 2px solid #3dcc8a; border-radius: 50%; opacity: .45; animation: pulse 3s ease-in-out infinite; }

    .scene-price { background: #071416; }
    .scene-price b { left: 8%; right: 8%; bottom: 28%; height: 2px; background: #2a4a4c; }
    .scene-price i { width: 8px; bottom: 28%; background: #7ed4c8; border-radius: 2px 2px 0 0; animation: floatY 2.2s ease-in-out infinite; }
    .scene-price i:nth-child(1) { left: 14%; height: 38%; }
    .scene-price i:nth-child(2) { left: 28%; height: 22%; animation-delay: .2s; }
    .scene-price i:nth-child(3) { left: 42%; height: 48%; animation-delay: .4s; }
    .scene-price i:nth-child(4) { left: 56%; height: 30%; animation-delay: .1s; }
    .scene-price i:nth-child(5) { left: 70%; height: 56%; animation-delay: .5s; }
    .scene-price em { top: 16%; left: 14%; color: #9fe8de; font-size: 22px; font-weight: 800; letter-spacing: -.04em; }

    .scene-idms { background: #14110c; }
    .scene-idms i { height: 18px; width: 28px; border-radius: 4px; background: #c9a36a; animation: drift 3.2s linear infinite; }
    .scene-idms i:nth-child(1) { top: 24%; left: -10%; }
    .scene-idms i:nth-child(2) { top: 46%; left: 10%; animation-duration: 4s; background: #8a6a3e; }
    .scene-idms i:nth-child(3) { top: 68%; left: -6%; animation-duration: 3.6s; }
    .scene-idms b, .scene-idms em { left: 0; right: 0; height: 2px; background: rgba(201,163,106,.25); }
    .scene-idms b { top: 32%; } .scene-idms em { top: 54%; }

    .scene-operation { background: radial-gradient(circle at 50% 45%, #2a1614, #0c0a0a 70%); }
    .scene-operation b { left: 50%; top: 42%; width: 90px; height: 90px; margin: -45px 0 0 -45px; border: 1px solid rgba(232,140,120,.4); border-radius: 50%; animation: spinSlow 14s linear infinite; }
    .scene-operation i { width: 14px; height: 14px; border-radius: 4px; background: #e88c78; animation: floatY 3s ease-in-out infinite; }
    .scene-operation i:nth-child(1) { left: 18%; top: 22%; }
    .scene-operation i:nth-child(2) { right: 16%; top: 28%; animation-delay: .4s; }
    .scene-operation i:nth-child(3) { left: 22%; bottom: 22%; animation-delay: .8s; }
    .scene-operation i:nth-child(4) { right: 20%; bottom: 20%; animation-delay: .2s; }
    .scene-operation i:nth-child(5) { left: 48%; top: 16%; background: #f0c4b4; }

    .scene-meals { background: radial-gradient(circle at 30% 20%, #4a2a20, #1a100e 68%); }
    .scene-meals i { border-radius: 50%; border: 3px solid rgba(244,180,140,.55); animation: pulse 3.4s ease-in-out infinite; }
    .scene-meals i:nth-child(1) { width: 86px; height: 86px; left: 12%; top: 22%; }
    .scene-meals i:nth-child(2) { width: 64px; height: 64px; left: 42%; top: 38%; animation-delay: .5s; }
    .scene-meals i:nth-child(3) { width: 52px; height: 52px; right: 14%; top: 20%; animation-delay: .9s; }
    .scene-meals b { left: 18%; top: 8%; width: 10px; height: 36px; border-radius: 8px; background: rgba(255,220,180,.25); animation: floatY 2.4s ease-in-out infinite; }

    .scene-ilearning { background: #121826; }
    .scene-ilearning i { color: #c8d4f0; font-weight: 800; font-size: 28px; animation: floatY 3.6s ease-in-out infinite; }
    .scene-ilearning i:nth-child(1) { left: 14%; top: 18%; }
    .scene-ilearning i:nth-child(2) { left: 38%; top: 40%; font-size: 22px; animation-delay: .3s; }
    .scene-ilearning i:nth-child(3) { left: 62%; top: 16%; animation-delay: .6s; }
    .scene-ilearning i:nth-child(4) { left: 22%; top: 58%; font-size: 18px; animation-delay: .2s; }
    .scene-ilearning b { right: 12%; bottom: 28%; width: 92px; height: 46px; border-radius: 16px 16px 16px 4px; background: rgba(180,196,230,.18); }

    .scene-math100 { background: #1a180e; }
    .scene-math100 em { left: 12%; top: 8%; font-size: 92px; font-weight: 900; color: rgba(239,214,120,.22); letter-spacing: -.06em; }
    .scene-math100 i { color: #efe3b0; font-weight: 700; font-size: 18px; animation: floatY 3s ease-in-out infinite; }
    .scene-math100 i:nth-child(1) { left: 18%; top: 22%; }
    .scene-math100 i:nth-child(2) { left: 46%; top: 16%; animation-delay:.3s; }
    .scene-math100 i:nth-child(3) { left: 70%; top: 30%; animation-delay:.6s; }
    .scene-math100 i:nth-child(4) { left: 28%; top: 48%; animation-delay:.2s; }

    .scene-zianna { background: radial-gradient(circle at 70% 20%, #3a2a24, #1a1614 66%); }
    .scene-zianna i { border-radius: 50%; background: rgba(232,176,150,.28); animation: pulse 4s ease-in-out infinite; }
    .scene-zianna i:nth-child(1) { width: 140px; height: 140px; left: -20px; top: -20px; }
    .scene-zianna i:nth-child(2) { width: 90px; height: 90px; right: 10%; top: 18%; animation-delay: .7s; background: rgba(168,214,190,.22); }
    .scene-zianna i:nth-child(3) { width: 54px; height: 54px; left: 38%; bottom: 18%; animation-delay: 1.1s; }

    .scene-100game { background: #141414; }
    .scene-100game i { width: 28px; height: 28px; border-radius: 6px; background: #2a2a2a; color: #ece6dc; font-size: 11px; font-weight: 700; display: grid; place-items: center; animation: pulse 2.8s ease-in-out infinite; }
    .scene-100game i:nth-child(1) { left: 16%; top: 22%; }
    .scene-100game i:nth-child(2) { left: 38%; top: 22%; animation-delay:.2s; }
    .scene-100game i:nth-child(3) { left: 60%; top: 22%; background:#d07a6e; animation-delay:.4s; }
    .scene-100game i:nth-child(4) { left: 16%; top: 48%; animation-delay:.1s; }
    .scene-100game i:nth-child(5) { left: 38%; top: 48%; animation-delay:.5s; }

    .scene-oppa { background: #120f0c; }
    .scene-oppa b { left: 18%; top: 10%; width: 64%; height: 78%; border: 2px solid rgba(212,180,106,.28); border-radius: 50% 50% 40% 40%; transform: rotate(-8deg); }
    .scene-oppa i { height: 2px; background: #d4b46a; opacity: .45; animation: drift 5s ease-in-out infinite; }
    .scene-oppa i:nth-child(1) { left: 16%; top: 30%; width: 58%; transform: rotate(-18deg); }
    .scene-oppa i:nth-child(2) { left: 22%; top: 44%; width: 50%; transform: rotate(12deg); animation-delay: .4s; }
    .scene-oppa i:nth-child(3) { left: 28%; top: 58%; width: 40%; transform: rotate(-8deg); }

    .scene-vibe { background: #10140e; }
    .scene-vibe b { left: 50%; top: 42%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border: 2px solid rgba(168,184,122,.4); border-radius: 50%; animation: spinSlow 10s linear infinite; border-top-color: #c8d88a; }
    .scene-vibe i { width: 40%; height: 3px; left: 12%; background: rgba(168,184,122,.35); animation: growX 2s ease-in-out infinite alternate; }
    .scene-vibe i:nth-child(1) { top: 22%; }
    .scene-vibe i:nth-child(2) { top: 30%; width: 28%; animation-delay: .3s; }
    .scene-vibe i:nth-child(3) { top: 38%; width: 34%; animation-delay: .6s; }

    @media (prefers-reduced-motion: reduce) {
      .scene i, .scene b, .work-media .scene { animation: none !important; transform: none !important; }
      .support-ring { animation: none; }
    }

    .post-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .chip {
      font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
      border: 1px solid rgba(255,255,255,.16); padding: 4px 10px; color: #bdbdbd;
      border-radius: 999px;
    }
    .post-card, .about-panel, .cms-panel {
      border: 1px solid rgba(255,255,255,.08); background: #1a1a1a;
      color: #f4f4f4; border-radius: 20px;
    }
    .post-card { padding: 26px; min-height: 220px; transition: transform .4s ease, border-color .3s ease; }
    .post-card h3 { font-size: 24px; font-weight: 800; line-height: 1.2; margin: 14px 0; letter-spacing: -.03em; }
    .empty-box {
      grid-column: 1 / -1; border: 1px dashed rgba(255,255,255,.14); padding: 80px 20px;

    }

    .about-panel { padding: 32px; }
    .about-kicker { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: #8d8d8d; }
    .about-muted { color: #9a9a9a; }
    .about-accent { color: #ffd4b8; }
    .ly-mark {
      width: 100%; aspect-ratio: 1; display: grid; place-items: center; border-radius: 20px;

                <div className="flex flex-col items-center">
                  <img src={QR_CODES[payMethod]} alt="赞赏二维码" className="w-48 h-48 object-cover mb-3" style={{borderRadius:16}} />
                  <p className="text-sm about-accent">扫码进行赞赏</p>
                </div>
              </div>
            </div>
          )}
        </>
      );

    const WorkCard = ({ p }) => (
      <a className="work-card" href={p.live} target="_blank" rel="noreferrer" data-cursor="hot">
        <div className="work-media">
          <img className="cover-img" src={p.localPreview || coverOf(p)} alt="" />
        </div>
        <div className="work-cap">
          <span>{p.name}</span>
          <small>{p.cat}</small>
        </div>
      </a>
    );

    const PostDetailView = ({ post, onBack }) => {
      const [copied, setCopied] = useState(false);
      const [showWechatTip, setShowWechatTip] = useState(false);
      const handleCopyLink = () => {
        const url = window.location.href;
        const textArea = document.createElement("textarea");
        textArea.value = url;
        document.body.appendChild(textArea);
        textArea.select();
        try { document.execCommand("copy"); setCopied(true); setTimeout(() => setCopied(false), 2000); } catch (err) {}
        document.body.removeChild(textArea);
      };
      return (
        <div className="page-enter max-w-4xl mx-auto">
          <button onClick={onBack} className="flex items-center mb-8" data-cursor="hot">
            <span className="p-2 mr-3" style={{border:"1px solid rgba(255,255,255,.14)", borderRadius:8}}><Icons.Back /></span>
            <span className="text-xs tracking-[0.22em] uppercase" style={{color:"#9a9a9a"}}>Back to list</span>
          </button>
          <article className="cms-panel p-6 md:p-12">
            <span className="chip">{post.category || "日记"}</span>
            <h1 className="text-4xl md:text-5xl mt-5 mb-6 leading-tight" style={{fontWeight:800}}>{post.title}</h1>
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 pb-8 mb-8" style={{borderBottom:"1px solid rgba(255,255,255,.1)"}}>
              <span className="text-sm about-muted">{post.date || (post.timestamp ? new Date(post.timestamp).toLocaleDateString("zh-CN") : "")}</span>
              <div className="flex gap-2">
                <button onClick={handleCopyLink} className="chip">{copied ? "已复制" : "复制链接"}</button>
                <button onClick={() => setShowWechatTip(true)} className="chip">转发朋友圈</button>
              </div>
            </div>
            <div className="prose max-w-none" dangerouslySetInnerHTML={{ __html: post.content }}></div>
          </article>
          {showWechatTip && (
            <div className="mask" onClick={() => setShowWechatTip(false)}>
              <div className="tip-card text-center" onClick={e => e.stopPropagation()}>
                <h3 className="text-2xl mb-3" style={{fontWeight:800}}>分享到朋友圈</h3>
                <p className="text-sm mb-6 about-muted">点击浏览器或微信右上角「···」，选择「分享到朋友圈」。</p>
                <button onClick={() => setShowWechatTip(false)} className="pill-btn" style={{width:"100%"}}>我知道了</button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const AboutSection = ({ about = DEFAULT_ABOUT }) => (
      <div>
        <div className="page-head">
          <h2>About</h2>
          <p>{about.kicker}</p>
        </div>
        <div className="about-wrap">
        <div className="about-panel">
          <div className="ly-mark">{about.mark || "LY"}</div>
          <h1 className="text-4xl mt-6 mb-2" style={{fontWeight:800}}>{about.name}</h1>
          <p className="about-accent">{about.role}</p>
          <div className="mt-6 space-y-2 text-sm about-muted">
            <p>{about.location}</p>
            <p>{about.email}</p>
            <p>{about.experience}</p>
          </div>
        </div>
        <div>
          <div className="about-panel mb-5">
            <div className="about-kicker">{about.ideaKicker || "IDEA"}</div>
            <h2 className="text-4xl mt-3 mb-5" style={{fontWeight:800}}>{highlightTitle(about.ideaTitle, about.ideaHighlight)}</h2>
            <p className="pretty leading-8 about-muted">{about.ideaBody}</p>
            <div className="grid grid-cols-2 gap-4 mt-8">
              {(about.stats || []).map((s, i) => (
                <div key={i}><div className="stat-n">{s.n}</div><div className="text-xs tracking-widest uppercase mt-2 about-muted">{s.label}</div></div>
              ))}
            </div>
          </div>
          <div className="grid md:grid-cols-2 gap-5">
            <div className="about-panel">
              <h3 className="text-2xl mb-6" style={{fontWeight:700}}>专业擅长</h3>
              {(about.skills || []).map((s) => (
                <div className="skill-row" key={s.name}>
                  <div className="flex justify-between text-sm"><span>{s.name}</span><span className="about-muted">{s.value}</span></div>
                  <div className="bar"><i style={{width:s.value}}></i></div>
                </div>
              ))}
            </div>
            <div className="about-panel">
              <h3 className="text-2xl mb-6" style={{fontWeight:700}}>行业经历</h3>
              {(about.industries || []).map((row) => (
                <div className="mb-5" key={row.k}>
                  <div className="text-xs tracking-widest uppercase mb-1 about-accent">{row.k}</div>
                  <div className="font-medium">{row.t}</div>
                  <div className="text-xs mt-1 about-muted">{row.d}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
      </div>
    );

    const App = () => {
      const [user, setUser] = useState(null);
      const isAdmin = isAdminUser(user);
      const [tab, setTab] = useState("work");
      const [studioPane, setStudioPane] = useState("home");
      const [filter, setFilter] = useState("All");
      const [searchOpen, setSearchOpen] = useState(false);
      const [query, setQuery] = useState("");
      const [posts, setPosts] = useState([]);
      const [projects, setProjects] = useState(DEFAULT_PROJECTS);
      const [about, setAbout] = useState(DEFAULT_ABOUT);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [status, setStatus] = useState("");
      const [isLoginOpen, setIsLoginOpen] = useState(false);
      const [isEditing, setIsEditing] = useState(false);
      const [viewingPost, setViewingPost] = useState(null);
      const [saving, setSaving] = useState(false);
      const [uploadingId, setUploadingId] = useState("");
      const [editData, setEditData] = useState({ title: "", content: "", category: "日记", id: null, file: null });
      const editorRef = useRef(null);
      const projectsRef = useRef(projects);
      const aboutRef = useRef(about);
      projectsRef.current = projects;
      aboutRef.current = about;
      const liveProjects = projects.filter(p => p.live && !p.hidden);
      const shown = liveProjects.filter(p => filter === "All" || p.cat === filter);
      const cats = CATS;

      useEffect(() => {
        document.body.classList.remove("mode-paper");
        document.documentElement.classList.remove("mode-paper");
      }, [tab, viewingPost]);

      useEffect(() => {
        if (sessionStorage.getItem(ADMIN_SESSION) === "1") setUser(localAdminUser);
        fetchPosts();
        loadSite();
      }, []);

      const loadSite = async () => {
        const pj = await loadJSON("site/projects.json");
        const overlay = storeGet("ly_projects_overlay");
        if (overlay && Array.isArray(overlay) && overlay.length) setProjects(overlay);
        else if (pj && Array.isArray(pj.projects)) setProjects(pj.projects);
        else if (Array.isArray(pj)) setProjects(pj);
        const ab = await loadJSON("site/about.json");
        const abOv = storeGet("ly_about_overlay");
        if (abOv) setAbout({ ...DEFAULT_ABOUT, ...abOv });
        else if (ab) setAbout({ ...DEFAULT_ABOUT, ...ab });
      };

      const patchProject = (id, patch) => setProjects(prev => prev.map(p => p.id === id ? { ...p, ...patch } : p));
      const moveProject = (i, dir) => setProjects(prev => {
        const next = [...prev];
        const j = i + dir;
        if (j < 0 || j >= next.length) return prev;
        [next[i], next[j]] = [next[j], next[i]];
        return next;
      });

      const saveProjects = async (next) => {
        if (!isAdmin) return alert("请先登录");
        const data = next || projectsRef.current;
        setSaving(true); setStatus("");
        try {
          const clean = data.map(({ coverRev, localPreview, ...p }) => p);
          const ok = storeSet("ly_projects_overlay", clean);
          setProjects(clean);
          setStatus(ok ? "项目已保存在本机。首页会马上更新。" : "已保存在本页会话里。本机长期存储空间不够（常见于大图），刷新后可能丢失。");
        } catch (e) { setStatus("保存失败：" + e.message); }
        setSaving(false);
      };

      const saveAbout = async (next) => {
        if (!isAdmin) return alert("请先登录");
        const data = next || aboutRef.current;
        setSaving(true); setStatus("");
        try {
          const ok = storeSet("ly_about_overlay", data);
          setAbout(data);
          setStatus(ok ? "About 已保存在本机。页面会马上更新。" : "已保存在本页会话里。本机长期存储空间不够，刷新后可能丢失。");
        } catch (e) { setStatus("保存失败：" + e.message); }
        setSaving(false);
      };

      const uploadCover = async (id, file) => {
        if (!file) return;
        if (!isAdmin) return alert("请先登录");
        if (file.size > 12 * 1024 * 1024) return alert("图片太大。动图建议压缩到 12MB 以内，优先用 WebP 或 GIF。");
        setUploadingId(id); setStatus("正在读取封面…");
        try {
          const url = await fileToDataUrl(file);
          const next = projectsRef.current.map(p => p.id === id ? { ...p, cover: url, coverRev: Date.now() } : p);
          setProjects(next);
          await saveProjects(next);
          if (url.length > 5 * 1024 * 1024) {
            setStatus("封面较大，可能写不进本机长期存储。本页仍会立刻更新，刷新后可能丢失。建议压缩到 2MB 以内。");
          }
        } catch (e) {
          setStatus("封面读取失败：" + e.message);
        }
        setUploadingId("");
      };

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === "Escape") setSearchOpen(false);
          const typing = e.target.closest("input, textarea, [contenteditable]");
          if (!typing && (e.key === "/" || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"))) {
            e.preventDefault();
            setSearchOpen(true);
          }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);

      const fetchPosts = async () => {
        setLoading(true);
        try {
          const map = new Map();
          const overlay = storeGet("ly_notes_overlay");
          if (Array.isArray(overlay)) {
            overlay.forEach(p => map.set(p.id, p));
          } else {
            const manifest = await loadJSON("notes/manifest.json");
            (Array.isArray(manifest) ? manifest : []).forEach(p => map.set(p.id, p));
          }
          setPosts([...map.values()].sort((a,b) => String(b.date || "").localeCompare(String(a.date || ""))));
          setError(null);
        } catch (err) {
          setError(err.message || "读取文章失败");
        }
        setLoading(false);
      };

      const openPost = async (meta) => {
        if (meta.content) { setViewingPost(meta); return; }
        const full = await loadJSON(`notes/${meta.file || meta.id + ".json"}`);
        setViewingPost({ ...meta, ...(full || {}) });
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        const account = e.target.user.value.trim();
        const password = e.target.password.value;
        const localOk = account.toLowerCase() === ADMIN_USER.toLowerCase() && (await hashText(password)) === ADMIN_PASS_HASH;
        if (!localOk) {
          alert("登录失败：账号或密码不对");
          return;
        }
        sessionStorage.setItem(ADMIN_SESSION, "1");
        setUser(localAdminUser);
        setIsLoginOpen(false);
        setTab("studio"); setStudioPane("home"); setIsEditing(false); setViewingPost(null);
        window.scrollTo(0, 0);
      };
      const handleLogout = () => {
        sessionStorage.removeItem(ADMIN_SESSION);
        setUser(null);
        if (tab === "studio") { setTab("work"); setIsEditing(false); setViewingPost(null); }
      };
      const execCmd = (cmd, val = null) => { document.execCommand(cmd, false, val); if (editorRef.current) editorRef.current.focus(); };
      const insertImage = () => {
        const pick = document.createElement("input");
        pick.type = "file";
        pick.accept = "image/png,image/jpeg,image/gif,image/webp";
        pick.onchange = async () => {
          const file = pick.files && pick.files[0];
          if (!file) return;
          if (!isAdmin) {
            const url = prompt("请输入图片链接 (URL):");
            if (url) execCmd("insertImage", url);
            return;
          }
          try {
            if (file.size > 5 * 1024 * 1024) alert("图片较大。建议压缩后再插入，否则文章可能无法长期保存在本机。");
            const url = await fileToDataUrl(file);
            execCmd("insertImage", url);
          } catch (e) { alert("图片读取失败: " + e.message); }
        };
        pick.click();
      };

      const savePost = async () => {
        const currentContent = editorRef.current ? editorRef.current.innerHTML : editData.content;
        if (!editData.title || !currentContent || currentContent === "<br>") return alert("标题和内容不能为空");
        if (!isAdmin) return alert("请先登录");
        setSaving(true);
        try {
          const date = editData.date || new Date().toISOString().slice(0,10);
          const id = editData.id || ("n" + Date.now().toString(36));
          const note = {
            id,
            title: editData.title,
            category: editData.category || "日记",
            type: "blog",
            date,
            content: currentContent
          };
          const next = [note, ...posts.filter(p => p.id !== note.id)];
          const ok = storeSet("ly_notes_overlay", next);
          setPosts(next);
          setIsEditing(false);
          setEditData({ title: "", content: "", category: "日记", id: null, file: null });
          if (!ok) alert("文章已显示在本页。本机长期存储空间不够，刷新后可能丢失。");
        } catch (e) {
          alert("发布失败: " + e.message);
        }
        setSaving(false);
      };

      const deletePost = async (post, e) => {
        e.stopPropagation();
        if (!confirm("确定删除这篇日记吗？")) return;
        try {
          const next = posts.filter(p => p.id !== post.id);
          storeSet("ly_notes_overlay", next);
          setPosts(next);
        } catch (err) { alert("删除失败: " + err.message); }
      };

      const editPostAction = async (post, e) => {
        e.stopPropagation();
        const full = post.content ? post : { ...post, ...(await loadJSON(`notes/${post.file || post.id + ".json"}`) || {}) };
        setEditData({ ...full, category: full.category || "日记" });
        setIsEditing(true); setViewingPost(null);
      };

      const go = (t) => { setTab(t); setIsEditing(false); setViewingPost(null); setStatus(""); window.scrollTo(0, 0); };
      const navItems = [["work","Home"],["blog","Blogs"],["about","About"], ...(isAdmin ? [["studio","Studio"]] : [])];
      const qn = query.trim().toLowerCase();
      const searchHits = !qn ? [] : [
        ...liveProjects.filter(p => (p.name + " " + p.blurb + " " + p.cat).toLowerCase().includes(qn)).map(p => ({ kind: "product", id: p.id, title: p.name, sub: p.cat, href: p.live })),
        ...posts.filter(p => ((p.title || "") + " " + (p.category || "")).toLowerCase().includes(qn)).map(p => ({ kind: "post", id: p.id, title: p.title, sub: p.category || "文章", post: p }))
      ];

      const renderCms = () => {
        if (viewingPost) return <PostDetailView post={viewingPost} onBack={() => setViewingPost(null)} />;
        const list = posts.filter(p => p.type === "blog" || p.type === "case" || !p.type);
        return (
          <>
            {tab !== "studio" ? (
            <div className="page-head flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
              <div>
                <h2>Blogs</h2>
                <p>公开页会读仓库里的 notes/。登录后可在本机写新的一篇，改动只保存在浏览器。</p>
              </div>
              {isAdmin && !isEditing && (
                <button onClick={() => { setEditData({ title: "", content: "", category: "日记", id: null, file: null }); setIsEditing(true); }} className="pill-btn" data-cursor="hot">+ 写一篇</button>
              )}
            </div>
            ) : (
              isAdmin && !isEditing ? (
                <div className="flex justify-end mb-6">
                  <button onClick={() => { setEditData({ title: "", content: "", category: "日记", id: null, file: null }); setIsEditing(true); }} className="pill-btn" data-cursor="hot">+ 写一篇</button>
                </div>
              ) : null
            )}
            {error && <p className="mb-6" style={{color:"#ffb38a"}}>{error}</p>}
            {loading ? (
              <div className="text-center py-24" style={{color:"#8a8a8a"}}>正在读取文章…</div>
            ) : isEditing ? (
              <div className="cms-panel p-4 md:p-8 space-y-4">
                <input className="w-full p-4 bg-transparent text-2xl outline-none" style={{fontWeight:800}} placeholder="标题" value={editData.title} onChange={e => setEditData({...editData, title: e.target.value})} />
                <input className="w-full px-4 text-sm outline-none bg-transparent" placeholder="# 标签（日记 / 洞察 / 案例）" value={editData.category} onChange={e => setEditData({...editData, category: e.target.value})} />
                <div className="flex flex-wrap gap-2 p-2" style={{border:"1px solid rgba(255,255,255,.1)", borderRadius:12}}>
                  <button onClick={() => execCmd("bold")} className="toolbar-btn"><Icons.Bold /></button>
                  <button onClick={() => execCmd("formatBlock", "h2")} className="toolbar-btn font-bold text-sm">H2</button>
                  <button onClick={() => execCmd("formatBlock", "p")} className="toolbar-btn text-sm">P</button>
                  <button onClick={insertImage} className="toolbar-btn"><Icons.Image /></button>
                </div>
                <div ref={editorRef} className="editor-content p-4 prose max-w-none" contentEditable placeholder="从今天开始写…" dangerouslySetInnerHTML={{__html: editData.content}}></div>
                <div className="flex justify-end space-x-4 pt-6 items-center">
                  <button onClick={() => setIsEditing(false)} className="about-muted">取消</button>
                  <button onClick={savePost} className="pill-btn">{saving ? "保存中…" : "发布"}</button>
                </div>
              </div>
            ) : (
              <div className="post-grid">
                {list.length > 0 ? list.map(post => (
                  <div key={post.id} onClick={() => openPost(post)} className="post-card cursor-pointer group" data-cursor="hot">
                    <div className="flex justify-between items-start mb-4">
                      <span className="chip">{post.category || "日记"}</span>
                      {isAdmin && (
                        <div className="flex space-x-1 opacity-0 group-hover:opacity-100">
                          <button onClick={(e) => editPostAction(post, e)} className="p-2"><Icons.Edit /></button>
                          <button onClick={(e) => deletePost(post, e)} className="p-2"><Icons.Delete /></button>
                        </div>
                      )}
                    </div>
                    <h3>{post.title}</h3>
                    <div className="text-[11px] pt-4" style={{borderTop:"1px solid rgba(255,255,255,.08)", color:"#8a8a8a"}}>{post.date || ""} · READ →</div>
                  </div>
                )) : <div className="empty-box">{isAdmin ? "还没有文章。点右上角写一篇。" : "还没有公开文章"}</div>}
              </div>
            )}
          </>
        );
      };

      const renderStudio = () => {
        if (!isAdmin) return <div className="empty-box">请先登录</div>;
        return (
          <>
            <div className="page-head flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
              <div>
                <h2>Studio</h2>
                <p>登录后可改首页卡片、写博客、编辑 About。改动保存在本机浏览器。</p>
              </div>
              {studioPane === "home" && <button className="pill-btn" onClick={() => saveProjects()} disabled={saving} data-cursor="hot">{saving ? "写入中…" : "保存项目"}</button>}
              {studioPane === "about" && <button className="pill-btn" onClick={() => saveAbout()} disabled={saving} data-cursor="hot">{saving ? "写入中…" : "保存 About"}</button>}
            </div>
            <div className="filters" style={{marginBottom: 28, justifyContent:"flex-start"}}>
              <div className="filter-track">
                {[["home","项目卡片"],["blogs","博客"],["about","关于我"]].map(([k,l]) => (
                  <button key={k} className={studioPane===k ? "on" : ""} onClick={() => { setStudioPane(k); setIsEditing(false); setStatus(""); }}>{l}</button>
                ))}
              </div>
            </div>
            {status && <p className={status.startsWith("保存失败") || status.includes("失败") ? "status-err" : "status-ok"} style={{marginBottom:18}}>{status}</p>}

            {studioPane === "blogs" && renderCms()}

            {studioPane === "home" && (
              <div className="studio-stack">
                <div className="flex justify-between items-center">
                  <p className="about-muted text-sm">封面支持 PNG / JPG / GIF / WebP。点左侧预览即可更换，动图会在首页播放。</p>
                  <button className="ghost" data-cursor="hot" onClick={() => {
                    const id = "p" + Date.now().toString(36);
                    setProjects(prev => [...prev, { id, name: "新项目", cat: "Work", blurb: "", live: "https://", cover: "", hidden: false }]);
                  }}>+ 增加项目</button>
                </div>
                {projects.map((p, i) => (
                  <div key={p.id} className="about-panel studio-card">
                    <div className="studio-row">
                      <div>
                        <div className="cover-pick">
                          {(p.localPreview || p.cover) ? <img src={p.localPreview || coverOf(p)} alt="" /> : <span className="about-muted text-xs">上传封面</span>}
                          <input type="file" accept="image/png,image/jpeg,image/gif,image/webp,image/apng" onChange={e => uploadCover(p.id, e.target.files && e.target.files[0])} />
                        </div>
                        <p className="text-xs about-muted mt-2">{uploadingId===p.id ? "读取中…" : (p.cover ? (p.cover.startsWith("data:") ? "本机封面" : p.cover) : "尚未上传")}{isMotionSrc(p.cover) ? " · 动图" : ""}</p>
                      </div>
                      <div>
                        <div className="field"><label>项目名称</label><input value={p.name} onChange={e => patchProject(p.id, { name: e.target.value })} /></div>
                        <div className="field"><label>分类</label>
                          <select value={p.cat} onChange={e => patchProject(p.id, { cat: e.target.value })}>
                            {["Work","Family","Life"].map(c => <option key={c} value={c}>{c}</option>)}
                          </select>
                        </div>
                        <div className="field"><label>简介</label><textarea value={p.blurb || ""} onChange={e => patchProject(p.id, { blurb: e.target.value })} /></div>
                        <div className="field"><label>产品链接</label><input value={p.live || ""} onChange={e => patchProject(p.id, { live: e.target.value })} /></div>
                        <div className="flex flex-wrap gap-2 items-center">
                          <button className="ghost" onClick={() => moveProject(i, -1)}>上移</button>
                          <button className="ghost" onClick={() => moveProject(i, 1)}>下移</button>
                          <button className="ghost" onClick={() => patchProject(p.id, { hidden: !p.hidden })}>{p.hidden ? "显示" : "隐藏"}</button>
                          <button className="ghost" onClick={() => { if (confirm("从首页列表移除这个项目？")) setProjects(prev => prev.filter(x => x.id !== p.id)); }}>删除</button>
                        </div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {studioPane === "about" && (
              <div className="studio-stack">
                <div className="about-panel studio-card">
                  <div className="field"><label>页眉说明</label><textarea value={about.kicker} onChange={e => setAbout({ ...about, kicker: e.target.value })} /></div>
                  <div className="grid md:grid-cols-2 gap-4">
                    <div className="field"><label>标识</label><input value={about.mark} onChange={e => setAbout({ ...about, mark: e.target.value })} /></div>
                    <div className="field"><label>姓名</label><input value={about.name} onChange={e => setAbout({ ...about, name: e.target.value })} /></div>
                    <div className="field"><label>角色</label><input value={about.role} onChange={e => setAbout({ ...about, role: e.target.value })} /></div>
                    <div className="field"><label>地点</label><input value={about.location} onChange={e => setAbout({ ...about, location: e.target.value })} /></div>
                    <div className="field"><label>邮箱</label><input value={about.email} onChange={e => setAbout({ ...about, email: e.target.value })} /></div>
                    <div className="field"><label>履历一句</label><input value={about.experience} onChange={e => setAbout({ ...about, experience: e.target.value })} /></div>
                  </div>
                </div>
                <div className="about-panel studio-card">
                  <div className="field"><label>理念小标题</label><input value={about.ideaKicker} onChange={e => setAbout({ ...about, ideaKicker: e.target.value })} /></div>
                  <div className="field"><label>理念标题</label><input value={about.ideaTitle} onChange={e => setAbout({ ...about, ideaTitle: e.target.value })} /></div>
                  <div className="field"><label>渐变高亮词</label><input value={about.ideaHighlight} onChange={e => setAbout({ ...about, ideaHighlight: e.target.value })} /></div>
                  <div className="field"><label>理念正文</label><textarea style={{minHeight:140}} value={about.ideaBody} onChange={e => setAbout({ ...about, ideaBody: e.target.value })} /></div>
                </div>
                <div className="about-panel studio-card">
                  <div className="flex justify-between items-center mb-3"><h3 style={{fontWeight:700}}>数据</h3><button className="ghost" onClick={() => setAbout({ ...about, stats: [...(about.stats||[]), { n: "0", label: "新指标" }] })}>+ 指标</button></div>
                  {(about.stats || []).map((s, i) => (
                    <div key={i} className="grid md:grid-cols-2 gap-3 mb-3">
                      <input value={s.n} onChange={e => setAbout({ ...about, stats: about.stats.map((x,j) => j===i ? { ...x, n: e.target.value } : x) })} />
                      <div className="flex gap-2">
                        <input value={s.label} onChange={e => setAbout({ ...about, stats: about.stats.map((x,j) => j===i ? { ...x, label: e.target.value } : x) })} />
                        <button className="ghost" onClick={() => setAbout({ ...about, stats: about.stats.filter((_,j) => j!==i) })}>删</button>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="about-panel studio-card">
                  <div className="flex justify-between items-center mb-3"><h3 style={{fontWeight:700}}>专业擅长</h3><button className="ghost" onClick={() => setAbout({ ...about, skills: [...(about.skills||[]), { name: "新能力", value: "80%" }] })}>+ 能力</button></div>
                  {(about.skills || []).map((s, i) => (
                    <div key={i} className="grid md:grid-cols-2 gap-3 mb-3">
                      <input value={s.name} onChange={e => setAbout({ ...about, skills: about.skills.map((x,j) => j===i ? { ...x, name: e.target.value } : x) })} />
                      <div className="flex gap-2">
                        <input value={s.value} onChange={e => setAbout({ ...about, skills: about.skills.map((x,j) => j===i ? { ...x, value: e.target.value } : x) })} />
                        <button className="ghost" onClick={() => setAbout({ ...about, skills: about.skills.filter((_,j) => j!==i) })}>删</button>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="about-panel studio-card">
                  <div className="flex justify-between items-center mb-3"><h3 style={{fontWeight:700}}>行业经历</h3><button className="ghost" onClick={() => setAbout({ ...about, industries: [...(about.industries||[]), { k: "新行业", t: "标题", d: "说明" }] })}>+ 经历</button></div>
                  {(about.industries || []).map((row, i) => (
                    <div key={i} className="mb-4">
                      <div className="field"><label>行业</label><input value={row.k} onChange={e => setAbout({ ...about, industries: about.industries.map((x,j) => j===i ? { ...x, k: e.target.value } : x) })} /></div>
                      <div className="field"><label>标题</label><input value={row.t} onChange={e => setAbout({ ...about, industries: about.industries.map((x,j) => j===i ? { ...x, t: e.target.value } : x) })} /></div>
                      <div className="field"><label>说明</label><input value={row.d} onChange={e => setAbout({ ...about, industries: about.industries.map((x,j) => j===i ? { ...x, d: e.target.value } : x) })} /></div>
                      <button className="ghost" onClick={() => setAbout({ ...about, industries: about.industries.filter((_,j) => j!==i) })}>删除这段</button>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </>
        );
      };

      return (
        <div className="relative z-[2]">
          <nav className="site-nav">
            <button className="nav-brand" onClick={() => go("work")} data-cursor="hot">
              <svg className="logo-m" viewBox="0 0 40 36" aria-hidden="true">
                <defs>
                  <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stopColor="#5cf0ff"/>
                    <stop offset="0.45" stopColor="#8a7bff"/>
                    <stop offset="0.72" stopColor="#ff7ad9"/>
                    <stop offset="1" stopColor="#ffd08a"/>
                  </linearGradient>
                </defs>
                <path fill="url(#mg)" d="M3 33V4h8.2l8.8 17L28.8 4H37v29h-8.2V16.6L20 33 11.2 16.6V33H3z"/>
              </svg>
              <span>CYO</span>
            </button>
            <div className="nav-links">
              {navItems.map(([k,l]) => (
                <button key={k} className={tab===k && !viewingPost ? "is-on" : ""} onClick={() => go(k)} data-cursor="hot">{l}</button>
              ))}
            </div>
            <div className="nav-right">
              <button className="search-btn" onClick={() => setSearchOpen(true)} data-cursor="hot" aria-label="搜索"><Icons.Search /></button>
              {isAdmin ? (
                <div className="flex items-center space-x-3">
                  <span className="hidden md:block text-[10px] tracking-widest uppercase" style={{color:"#8ee8d8"}}>Studio</span>
                  <button onClick={handleLogout}>退出</button>
                </div>
              ) : (
                <button onClick={() => setIsLoginOpen(true)} data-cursor="hot" aria-label="登录"><Icons.Lock /></button>
              )}
            </div>
          </nav>
          <nav className="tabbar" aria-label="页面切换">
            {navItems.map(([k,l]) => (
              <button key={k} className={tab===k && !viewingPost ? "is-on" : ""} onClick={() => go(k)}>{l}</button>
            ))}
          </nav>

          {tab === "work" && !viewingPost && (
            <>
              <section className="hero">
                <h1 className="hero-title" id="heroTitle">解锁你的<br/>数智<em>变革</em>超能力</h1>
                <p className="hero-sub pretty">
                  <span className="hero-mc">
                    <span><span className="mc mc-m">M</span>ercy · 包容</span>
                    <span><span className="mc mc-c">C</span>ourage · 勇敢</span>
                    <span><span className="mc mc-y">Y</span>earning · 热忱</span>
                    <span><span className="mc mc-o">O</span>nward · 前行。</span>
                  </span>
                  <span className="hero-role">数字化转型专家 / 战略架构师。点卡片，直接进入可运行的产品现场。</span>
                </p>
                <a className="hero-cta" href="#work" data-cursor="hot">进入现场 →</a>
              </section>

              <section className="work-section" id="work">
                <div className="filters">
                  <div className="filter-track">
                    {cats.map(c => (
                      <button key={c} className={filter===c ? "on" : ""} onClick={() => setFilter(c)} data-cursor="hot">{c}</button>
                    ))}
                  </div>
                </div>
                <div className="work-grid">
                  {shown.map(p => <WorkCard key={p.id} p={p} />)}
                </div>
              </section>
            </>
          )}

          <main className={"section page-main" + (tab === "work" && !viewingPost ? " is-hidden" : "")}>
            {tab === "about" ? <AboutSection about={about} /> : tab === "studio" ? renderStudio() : (tab === "blog" || tab === "case" || viewingPost) ? renderCms() : null}
          </main>

          <footer className="site-foot">
            <span>© {new Date().getFullYear()} Mcyo · LY</span>
            <a href="https://github.com/mcyo-yoyoyo" target="_blank" rel="noreferrer" style={{color:"inherit", textDecoration:"none"}}>github.com/mcyo-yoyoyo</a>
          </footer>

          {isLoginOpen && (
            <div className="mask" onClick={() => setIsLoginOpen(false)}>
              <form onSubmit={handleLogin} className="login-card" onClick={e => e.stopPropagation()}>
                <div className="text-center mb-6">
                  <div className="w-16 h-16 mx-auto mb-4 grid place-items-center" style={{border:"1px solid rgba(255,255,255,.12)", borderRadius:16}}><Icons.Lock /></div>
                  <h3 className="text-3xl" style={{fontWeight:800}}>Studio Login</h3>
                  <p className="text-xs tracking-[0.18em] uppercase mt-2 about-muted">仅供管理员访问</p>
                </div>
                <div className="field"><label>账号</label>
                  <input name="user" type="text" defaultValue={ADMIN_USER} placeholder="ADMIN" autoComplete="username" required />
                </div>
                <div className="field"><label>密码</label>
                  <input name="password" type="password" placeholder="PASSWORD" required />
                </div>
                <button type="submit" className="pill-btn w-full mt-4" style={{width:"100%"}}>验证并进入后台</button>
                <button type="button" onClick={() => setIsLoginOpen(false)} className="w-full mt-4 text-[10px] tracking-widest uppercase about-muted">Close</button>
              </form>
            </div>
          )}
          {searchOpen && (
            <div className="search-mask" onClick={() => setSearchOpen(false)}>
              <div className="search-card" onClick={e => e.stopPropagation()}>
                <input autoFocus value={query} onChange={e => setQuery(e.target.value)} placeholder="搜索项目与文章…" />
                {qn && searchHits.length === 0 && <div className="search-empty">没有匹配结果</div>}
                {searchHits.map(hit => hit.kind === "product" ? (
                  <a key={"p-"+hit.id} className="search-hit" href={hit.href} target="_blank" rel="noreferrer" data-cursor="hot">
                    {hit.title}<small>{hit.sub} · 产品</small>
                  </a>
                ) : (
                  <button key={"n-"+hit.id} className="search-hit" style={{width:"100%", textAlign:"left", background:"transparent", border:0}} onClick={() => { setSearchOpen(false); go("blog"); openPost(hit.post); }} data-cursor="hot">
                    {hit.title}<small>{hit.sub} · 文章</small>
                  </button>
                ))}
              </div>
            </div>
          )}
          <SupportSection />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

    (function motion() {
      const fine = window.matchMedia("(pointer:fine)").matches;
      const dot = document.getElementById("cDot");
      const ring = document.getElementById("cRing");
      let x = innerWidth/2, y = innerHeight/3, rx = x, ry = y;
      if (fine) document.body.classList.add("has-pointer");
      window.addEventListener("pointermove", (e) => {
        x = e.clientX; y = e.clientY;
        document.documentElement.style.setProperty("--mx", x + "px");
        document.documentElement.style.setProperty("--my", y + "px");
        const nx = (x / innerWidth) - .5, ny = (y / innerHeight) - .5;
        const t = document.getElementById("heroTitle");
        if (t) t.style.transform = `translate3d(${nx*18}px, ${ny*12}px, 0)`;
        if (fine && dot) { dot.style.left = x + "px"; dot.style.top = y + "px"; }
        if (fine && ring) ring.classList.toggle("hot", !!e.target.closest("[data-cursor='hot'], a, button"));
      });
      const loop = () => {
        rx += (x - rx) * .16; ry += (y - ry) * .16;
        if (fine && ring) { ring.style.left = rx + "px"; ring.style.top = ry + "px"; }
        requestAnimationFrame(loop);
      };
      loop();
    })();
  </script>
</body>
</html>
